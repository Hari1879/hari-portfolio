<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" shape-rendering="geometricPrecision">
  <!--
    Projection: x = (lon - 68) / 29.5 * 500
                y = (37  - lat) / 29  * 580
    Boundary  : lon 68–97.5°E, lat 8–37°N
  -->
  <defs>
    <linearGradient id="bg" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#1e5296" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#071828" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

