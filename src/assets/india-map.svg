  <!-- Sri Lanka -->
  <ellipse cx="190" cy="564" rx="9" ry="12" fill="url(#bg)" stroke="#5ab4ff" stroke-width="1"/>

  <!-- Lakshadweep -->
  <circle cx="68" cy="456" r="3.5" fill="url(#bg)" stroke="#5ab4ff" stroke-width="0.8"/>
</svg>

